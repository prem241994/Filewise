name: macOS build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          swiftc --version
      - name: Build and verify local package
        run: |
          set -o pipefail
          zsh ./scripts/package.sh 2>&1 | tee build.log
      # Compiler errors as annotations, so they show on the run's summary page.
      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "(error|fatal error):" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line#$GITHUB_WORKSPACE/}"
          done
      - name: Test index health
        run: ./scripts/test-index-health.sh
      - name: Test trial and unlock rules
        run: ./scripts/test-license.sh
      - name: Test duplicate keep rules
        run: ./scripts/test-duplicates.sh
      - name: Test scanning and search
        run: ./scripts/test-scan-search.sh
      - name: Test search date phrases
        run: ./scripts/test-search-dates.sh
      - name: Test text in screenshots
        run: ./scripts/test-image-text.sh
      - name: Test Trash safety
        run: ./scripts/test-trash-safety.sh
